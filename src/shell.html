<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>街景 3D 实景建模 · Block Study</title>
<style>
  :root{--bg:#0b0e13;--fg:#e8eaed;--mut:#8a94a3;--acc:#ffb020;--pan:rgba(14,18,25,.78)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;touch-action:none}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #hud{position:fixed;left:10px;top:10px;right:10px;display:flex;gap:8px;align-items:flex-start;
    pointer-events:none;flex-wrap:wrap;z-index:5}
  .card{background:var(--pan);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.09);
    border-radius:10px;padding:8px 10px;pointer-events:auto;box-shadow:0 4px 18px rgba(0,0,0,.35)}
  #title b{font-size:13px;letter-spacing:.5px}
  #title span{display:block;font-size:10px;color:var(--mut)}
  #views{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto;align-items:center}
  button{all:unset;cursor:pointer;background:var(--pan);border:1px solid rgba(255,255,255,.12);
    color:var(--fg);border-radius:9px;padding:7px 11px;font-size:12px;white-space:nowrap}
  button:active{transform:scale(.96)}
  button.on{border-color:var(--acc);color:var(--acc)}
  #seg{display:flex;background:var(--pan);border:1px solid rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
  #seg button{background:transparent;border:none;padding:7px 13px}
  #seg button.on{background:rgba(255,176,32,.16);color:var(--acc)}
  #panel{position:fixed;right:10px;bottom:10px;z-index:5;background:var(--pan);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:10px 12px;font-size:12px;min-width:200px;
    max-height:62vh;overflow-y:auto}
  #panel.hide{display:none}
  #panel label{display:flex;justify-content:space-between;gap:10px;color:var(--mut);margin:8px 0 2px}
  #panel input[type=range]{width:100%;accent-color:var(--acc)}
  #panel .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  #panel button{padding:5px 9px;font-size:11px}
  #gear{position:fixed;right:10px;bottom:10px;z-index:6;display:none}
  #stats{position:fixed;left:10px;bottom:10px;z-index:5;font-size:10px;color:var(--mut);
    background:var(--pan);border-radius:8px;padding:4px 8px;border:1px solid rgba(255,255,255,.07)}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:4;font-size:11px;
    color:var(--mut);background:var(--pan);border-radius:20px;padding:5px 14px;border:1px solid rgba(255,255,255,.07);
    transition:opacity .6s;max-width:92vw;text-align:center;pointer-events:none}
  #err{position:fixed;left:10px;top:60px;right:10px;z-index:9;color:#ff8080;font-size:11px;
    background:rgba(20,0,0,.85);border:1px solid #601b1b;border-radius:8px;padding:8px;
    max-height:40vh;overflow:auto;display:none;white-space:pre-wrap;touch-action:auto}
  #boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--mut);font-size:12px;letter-spacing:2px;transition:opacity .5s}
  /* 对象信息弹框 */
  #pop{position:fixed;left:50%;transform:translateX(-50%);top:14%;z-index:8;width:min(320px,90vw);
    background:rgba(12,16,23,.94);backdrop-filter:blur(10px);border:1px solid rgba(255,176,32,.45);
    border-radius:14px;padding:14px 16px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #pop.show{display:block}
  #pop .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  #pop .nm{font-size:15px;font-weight:700}
  #pop .id{font-size:10px;color:var(--acc);letter-spacing:1px}
  #pop .x{cursor:pointer;color:var(--mut);font-size:18px;padding:0 4px;line-height:1}
  #pop table{width:100%;border-collapse:collapse;font-size:12px}
  #pop td{padding:4px 0;border-top:1px solid rgba(255,255,255,.06);color:var(--fg)}
  #pop td:first-child{color:var(--mut);width:64px}
  /* 虚拟摇杆 */
  #stick{position:fixed;left:18px;bottom:56px;z-index:7;width:118px;height:118px;border-radius:50%;
    background:rgba(20,26,36,.55);border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);
    touch-action:none;display:none}
  #stick.show{display:block}
  #thumb{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:rgba(255,176,32,.85);box-shadow:0 2px 12px rgba(0,0,0,.5);pointer-events:none}
  #stick .lab{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:9px;color:var(--mut);letter-spacing:1px}
  #du{position:fixed;left:18px;bottom:182px;z-index:7;display:none;gap:6px}
  #du.show{display:flex}
  #du button{font-size:11px;padding:6px 10px}
  @media(max-width:520px){#panel{font-size:11px;min-width:176px}#title span{display:none}
    #stick{width:104px;height:104px}#thumb{width:46px;height:46px;margin:-23px 0 0 -23px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div class="card" id="title"><b>街景 3D 实景建模</b><span>AERIAL BLOCK RECONSTRUCTION · 单文件可离线</span></div>
  <div id="views">
    <div id="seg"><button id="m3d" class="on">3D</button><button id="m2d">2D</button></div>
    <button data-v="oblique" class="v3 on">斜视航拍</button>
    <button data-v="street" class="v3">街景视角</button>
    <button data-v="orbit" class="v3">自动环绕</button>
    <span class="v2" style="display:none"><button id="rotL">⟲ 左转</button><button id="rotR">右转 ⟳</button></span>
    <button id="stickBtn">操控假人</button>
  </div>
</div>
<div id="pop">
  <div class="hd"><div><span class="nm"></span> <span class="id"></span></div><span class="x">×</span></div>
  <table></table>
</div>
<div id="du"><button id="follow">跟随视角</button><button id="resetD">复位</button></div>
<div id="stick"><div id="thumb"></div><div class="lab">移动</div></div>
<div id="panel">
  <label>建模图层 <span>Layers</span></label>
  <div class="row">
    <button data-layer="bld" class="on">建筑</button>
    <button data-layer="veh" class="on">车辆</button>
    <button data-layer="per" class="on">假人</button>
    <button data-layer="rte" class="on">路线</button>
  </div>
  <label>日照角度 <span id="sunv">14h</span></label>
  <input id="sun" type="range" min="0" max="100" value="42">
  <label>阴影贴图 <span>Shadow</span></label>
  <div class="row">
    <button id="q1024" class="on">1024</button>
    <button id="q2048">2048</button>
    <button id="qoff">关闭</button>
  </div>
  <div class="row">
    <button id="fog" class="on">雾效</button>
    <button id="dl">保存截图</button>
    <button id="close">收起</button>
  </div>
  <label>路线标记 <span id="routelen">0 m</span></label>
  <div class="row">
    <button id="clrRoute">清除路线</button>
    <button id="undoRoute">撤销一点</button>
  </div>
</div>
<button id="gear">⚙</button>
<div id="hint">点选建筑/车辆查看信息 · 长按地图添加 起点→途经→终点 · 双指缩放旋转</div>
<div id="stats"></div>
<div id="err"></div>
<div id="boot">LOADING&nbsp;SCENE…</div>

<script type="module">
__APP_JS__
</script>
</body>
</html>
